<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Not Found - FreshMart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h1 {
      font-size: 5rem;
      color: #2e7d32;
      margin: 0;
    }

    h2 {
      font-size: 2rem;
      margin: 10px 0 20px;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      color: #555;
    }

    a {
      background: #2e7d32;
      color: white;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
    }

    a:hover {
      background: #1b5e20;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Oops! Page Not Found</h2>
  <p>Sorry, the page you are looking for doesn’t exist.  
     Let’s get you back to the supermarket!</p>
  <a href="index.html">Go to Home</a>

</html>
